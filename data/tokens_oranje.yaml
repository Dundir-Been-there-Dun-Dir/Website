# The variant palette, as the style guide reports it. See assets/css/orange.css
# for how the flag bands were averaged, why the grounds are steps down the flag
# blue rather than the flag blue itself, and why the accent is an orange rather
# than the flag red.

name: Oranje
tagline: "The averaged flag white and blue as grounds, with Oranje #F36C21 as the accent: the loudest of the three candidates on /ab/, and the one that made the accent split into three roles."

intro:
  lab: This is the shipped palette
  text: >-
    Navy grounds from the flag averages, with Oranje #F36C21 as the accent,
    picked over the flag red and a darker orange on /ab/. Because it is bright,
    text on an accent fill is dark rather than white. The previous palette,
    massa, is still built and reachable at /massa/.

groups:
  - label: The source colours, as each flag specifies them
    swatches:
      - token: "US red"
        fill: "#B31942"
        hex: "#B31942"
        role: "Old Glory Red"
      - token: "NL red"
        fill: "#AE1C28"
        hex: "#AE1C28"
        role: "helder vermiljoen, the Dutch state specification"
      - token: "RU red"
        fill: "#D52B1E"
        hex: "#D52B1E"
        role: "the brightest of the three, and it pulls the mean"
      - token: "US blue"
        fill: "#0A3161"
        hex: "#0A3161"
        role: "Old Glory Blue"
      - token: "NL blue"
        fill: "#21468B"
        hex: "#21468B"
        role: "kobaltblauw, the lightest of the three"
      - token: "RU blue"
        fill: "#0039A6"
        hex: "#0039A6"
        role: "the most saturated of the three"

  - label: The three bands, averaged in Oklab
    swatches:
      - token: red
        fill: "#BC2130"
        hex: "#BC2130"
        sample: "red"
        role: "the mean of the three flag reds. Evidence, not a token: the accent is Oranje, below"
      - token: white
        fill: "#FFFFFF"
        onhex: "#061127"
        hex: "#FFFFFF"
        sample: "white"
        role: "identical in all three flags. Becomes the light band, unchanged"
      - token: blue
        fill: "#0F3B86"
        hex: "#0F3B86"
        sample: "blue"
        role: "the mean of the three flag blues. Too light to be a page ground, so it becomes the hue the grounds are stepped down from"

  - label: Grounds, stepped down the flag blue
    swatches:
      - token: "--bitumen"
        hex: "#000840"
        role: "the page. Hero, dark bands, header, footer"
      - token: "--zinc"
        hex: "#00144C"
        role: "raised surface, hover state"
      - token: "--zinc-2"
        hex: "#0D2F68"
        role: "hairlines and grid gaps on dark"
      - token: "--chalk"
        hex: "#FFFFFF"
        role: "the light band. The flag white, not an off white"
      - token: "--chalk-2"
        hex: "#E9EEF6"
        role: "tint band. Separation without inversion"

  - label: Text on dark
    swatches:
      - token: "--concrete"
        hex: "#ABBBD4"
        on: "--bitumen"
        sample: "9.7:1"
        role: "body text on dark"
      - token: "--concrete-dim"
        hex: "#818FA8"
        on: "--bitumen"
        sample: "5.8:1"
        role: "mono labels and sources on dark"

  - label: Text on white
    swatches:
      - token: "--ink"
        hex: "#061127"
        on: "--chalk"
        sample: "18.8:1"
        role: "text on white"
      - token: "--ink-soft"
        hex: "#3E4D66"
        on: "--chalk"
        role: "secondary prose on white"
      - token: "--ink-quiet"
        hex: "#5C6A83"
        on: "--chalk"
        sample: "5.5:1"
        role: "sources and labels on white"
      - token: "--rule-lt"
        hex: "#C1CCDF"
        on: "--ink"
        role: "hairlines on white"

  - label: The accent, in three steps
    swatches:
      - token: "--menie"
        hex: "#F36C21"
        sample: "fill and display"
        role: "fills, rules, and display sized type. 6.29:1 on navy, 3.01:1 on white so large text only"
      - token: "--menie-lt"
        hex: "#FF9051"
        sample: "small text on dark"
        role: "the accent as small text on a dark band, 8.44:1"
      - token: "--menie-dk"
        hex: "#BE4200"
        on: "--chalk"
        sample: "small text on light"
        role: "the accent as small text on a light band, 5.29:1 on white and 4.54:1 on the tint"
      - token: "--on-menie"
        hex: "#061127"
        role: "what sits on an accent fill. Dark, because white on this orange is 3.01:1"
      - token: "--menie-wash"
        hex: "#FFF4E1"
        on: "--ink"
        role: "caveat panel ground on a light band"

grounds:
  - class: g-bitumen
    label: navy
  - class: g-zinc
    label: navy raised
  - class: g-chalk
    label: white
  - class: g-chalk2
    label: white tint

contrast:
  - pair: menie on navy
    ratio: "6.29:1"
    rule: "anything. Fill, rule, display type, small text"
    ok: true
  - pair: menie on white
    ratio: "3.01:1"
    rule: "a fill, a rule, or display sized type. Never small text"
  - pair: menie-lt on navy
    ratio: "8.44:1"
    rule: "the accent as small text on a dark band"
    ok: true
  - pair: menie-dk on white
    ratio: "5.29:1"
    rule: "the accent as small text on a light band"
    ok: true
  - pair: menie-dk on the tint band
    ratio: "4.54:1"
    rule: "the pairing that fixes the dark step where it is"
    ok: true
  - pair: ink on a menie fill
    ratio: "6.25:1"
    rule: "text on the accent is dark, not white. White would be 3.01:1"
    ok: true

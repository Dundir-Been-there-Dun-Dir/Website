<div id="sus-survey-wrapper">

<style>
.sus-form { margin-top: 2rem; }
.sus-question { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--color-border); }
.sus-question:last-of-type { border-bottom: none; }
.sus-question__text { font-weight: 600; font-size: 1.05rem; margin-bottom: 1rem; }
.sus-scale { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.sus-scale label { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; cursor: pointer; min-width: 52px; }
.sus-scale input[type="radio"] { width: 20px; height: 20px; accent-color: var(--color-accent); cursor: pointer; }
.sus-scale .scale-num { font-size: 0.8rem; font-weight: 700; color: var(--color-text-muted); }
.sus-scale .scale-lbl { font-size: 0.7rem; color: var(--color-text-muted); text-align: center; line-height: 1.2; max-width: 60px; }
.sus-scale label:hover .scale-num { color: var(--color-accent); }
.sus-email-section { margin-top: 2.5rem; padding: 2rem; background: var(--color-bg-blue); border-radius: 4px; }
.sus-email-section p { font-size: 0.95rem; margin-bottom: 1rem; color: var(--color-text-muted); }
.sus-email-section input[type="email"] { width: 100%; padding: 0.65rem 1rem; border: 1px solid var(--color-border); border-radius: 3px; font-size: 1rem; font-family: var(--font-stack); }
.sus-email-section input[type="email"]:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.sus-actions { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; }
.sus-loading { display: none; color: var(--color-text-muted); margin-top: 1rem; font-style: italic; }
.sus-report { display: none; margin-top: 2rem; }
.sus-report__score { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.5rem; }
.sus-report__number { font-size: 3.5rem; font-weight: 700; color: var(--color-stat-number); line-height: 1; }
.sus-report__grade { font-size: 1.1rem; color: var(--color-text-muted); }
.sus-report__divider { border: none; border-top: 1px solid var(--color-border); margin: 1.5rem 0; }
.sus-report__content h2 { font-size: 1.15rem; color: var(--color-accent); margin: 1.5rem 0 0.5rem; }
.sus-report__content h3 { font-size: 1rem; margin: 1rem 0 0.4rem; }
.sus-report__content ul { margin: 0.5rem 0 1rem; padding-left: 1.5rem; }
.sus-report__content li { margin-bottom: 0.3rem; font-size: 1rem; }
.sus-report__content p { font-size: 1rem; margin-bottom: 0.75rem; }
.sus-email-note { margin-top: 1rem; font-size: 0.9rem; color: var(--color-text-muted); }
.sus-error { color: #c0392b; margin-top: 1rem; font-size: 0.95rem; }
@media (max-width: 480px) {
  .sus-scale { gap: 0.25rem; }
  .sus-scale label { min-width: 44px; }
}
</style>

<form id="sus-form" class="sus-form" novalidate>
  <div id="sus-questions-container"></div>

  <div class="sus-email-section">
    <p>{{ if eq .Lang "en" }}Want a copy in your inbox? Completely optional.{{ else }}Wilt u het rapport ook per e-mail? Volledig optioneel.{{ end }}</p>
    <input type="email" id="sus-email" name="email"
      placeholder="{{ if eq .Lang "en" }}your@email.com{{ else }}uw@emailadres.nl{{ end }}"
      autocomplete="email">
  </div>

  <div class="sus-actions">
    <button type="submit" class="btn-primary">{{ if eq .Lang "en" }}Generate my report{{ else }}Genereer mijn rapport{{ end }}</button>
  </div>
  <div class="sus-loading" id="sus-loading">{{ if eq .Lang "en" }}Analysing your answers…{{ else }}Uw antwoorden worden geanalyseerd…{{ end }}</div>
  <div class="sus-error" id="sus-error" hidden></div>
</form>

<div class="sus-report" id="sus-report">
  <div class="sus-report__score">
    <span class="sus-report__number" id="sus-score-num"></span>
    <span style="font-size:1.5rem;color:var(--color-text-muted)">/100</span>
    <span class="sus-report__grade" id="sus-grade-label"></span>
  </div>
  <hr class="sus-report__divider">
  <div class="sus-report__content" id="sus-report-body"></div>
  <div class="sus-email-note" id="sus-email-note" hidden></div>
  <div class="sus-actions" style="margin-top:2rem">
    <button class="btn-primary" id="sus-download-btn">{{ if eq .Lang "en" }}Download report (HTML){{ else }}Rapport downloaden (HTML){{ end }}</button>
    <button class="btn-secondary" id="sus-restart-btn">{{ if eq .Lang "en" }}Start over{{ else }}Opnieuw invullen{{ end }}</button>
  </div>
</div>

<script>
(function() {
  var WEBHOOK = {{ .Site.Params.n8nWebhook | jsonify }};
  var LANG = {{ .Lang | jsonify }};

  var Q = {
    nl: [
      {id:'q1',  text:'Ik denk dat ik dit systeem regelmatig zou willen gebruiken.',                            pos:true },
      {id:'q2',  text:'Het systeem was onnodig ingewikkeld.',                                                    pos:false},
      {id:'q3',  text:'Het systeem was gemakkelijk te gebruiken.',                                               pos:true },
      {id:'q4',  text:'Ik denk dat ik technische ondersteuning nodig zou hebben om dit systeem te gebruiken.', pos:false},
      {id:'q5',  text:'De verschillende onderdelen van het systeem werkten goed samen.',                         pos:true },
      {id:'q6',  text:'Er zat te veel inconsistentie in het systeem.',                                           pos:false},
      {id:'q7',  text:'Ik denk dat de meeste mensen dit systeem snel zouden leren gebruiken.',                  pos:true },
      {id:'q8',  text:'Het systeem was heel omslachtig om te gebruiken.',                                        pos:false},
      {id:'q9',  text:'Ik voelde me erg zeker bij het gebruiken van het systeem.',                               pos:true },
      {id:'q10', text:'Ik moest veel leren voordat ik goed met het systeem kon werken.',                        pos:false}
    ],
    en: [
      {id:'q1',  text:"I'd probably use this system often.",                                     pos:true },
      {id:'q2',  text:"The system felt more complicated than it needed to be.",                   pos:false},
      {id:'q3',  text:"The system was easy to figure out.",                                       pos:true },
      {id:'q4',  text:"I think I'd need help from a tech expert to use this system.",            pos:false},
      {id:'q5',  text:"Everything in the system seemed to work well together.",                  pos:true },
      {id:'q6',  text:"The system felt inconsistent in how things worked.",                      pos:false},
      {id:'q7',  text:"I think most people could learn to use this system quickly.",             pos:true },
      {id:'q8',  text:"Using the system felt like a hassle.",                                    pos:false},
      {id:'q9',  text:"I felt confident while using the system.",                                pos:true },
      {id:'q10', text:"I had to learn a lot before I could start using the system properly.",    pos:false}
    ]
  };

  var LBSL = { nl:{low:'Helemaal mee oneens',high:'Helemaal mee eens'}, en:{low:'Strongly disagree',high:'Strongly agree'} };
  var questions = Q[LANG] || Q.nl;
  var lbl = LBSL[LANG] || LBSL.nl;

  // Render radio questions
  var container = document.getElementById('sus-questions-container');
  questions.forEach(function(q, i) {
    var div = document.createElement('div');
    div.className = 'sus-question';
    var opts = [1,2,3,4,5].map(function(v) {
      return '<label><input type="radio" name="'+q.id+'" value="'+v+'" required>'
        +'<span class="scale-num">'+v+'</span>'
        +(v===1?'<span class="scale-lbl">'+lbl.low+'</span>':v===5?'<span class="scale-lbl">'+lbl.high+'</span>':'<span class="scale-lbl"></span>')
        +'</label>';
    }).join('');
    div.innerHTML='<p class="sus-question__text">'+(i+1)+'. '+q.text+'</p><div class="sus-scale">'+opts+'</div>';
    container.appendChild(div);
  });

  function mdToHtml(md) {
    return md
      .replace(/^## (.+)$/gm,'<h2>$1</h2>')
      .replace(/^### (.+)$/gm,'<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/^[-*] (.+)$/gm,'<li>$1</li>')
      .replace(/(<li>[\s\S]+?<\/li>\n?)+/g,function(m){return '<ul>'+m+'</ul>';})
      .replace(/\n\n/g,'</p><p>')
      .replace(/^(?!<[hulo])(.+)$/gm,'<p>$1</p>');
  }

  function downloadReport(data) {
    var html='<!DOCTYPE html><html lang="'+LANG+'"><head><meta charset="UTF-8"><title>SUS Rapport '+data.susScore+'/100</title>'
      +'<style>body{font-family:system-ui,sans-serif;max-width:700px;margin:40px auto;padding:20px;color:#1a1a1a;line-height:1.7}'
      +'.brand{color:#1b4fd8;font-weight:700;margin-bottom:2rem}.score{font-size:3rem;font-weight:700;color:#0d2b7a;line-height:1}'
      +'.grade{color:#5a5a5a;margin:.25rem 0 2rem}hr{border:none;border-top:1px solid #d8d8d8;margin:2rem 0}'
      +'h2{color:#1b4fd8;margin-top:1.5rem}ul{padding-left:1.5rem;margin:.5rem 0 1rem}li{margin-bottom:.3rem}'
      +'.footer{color:#888;font-size:.85rem;margin-top:3rem;padding-top:1rem;border-top:1px solid #eee}</style>'
      +'</head><body>'
      +'<p class="brand">Dundir \u2014 SUS Rapport</p>'
      +'<p class="score">'+data.susScore+'/100</p>'
      +'<p class="grade">'+data.grade+'</p><hr>'
      +mdToHtml(data.report)
      +'<div class="footer">Gegenereerd via dundir.com</div>'
      +'</body></html>';
    var blob=new Blob([html],{type:'text/html;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='sus-rapport-'+data.susScore+'.html';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  document.getElementById('sus-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var form=e.target;
    var errEl=document.getElementById('sus-error');
    errEl.hidden=true;

    var unanswered=questions.filter(function(q){return !form.querySelector('input[name="'+q.id+'"]:checked');});
    if (unanswered.length) {
      errEl.textContent=LANG==='en'
        ?'Please answer all '+unanswered.length+' remaining question(s).'
        :'Beantwoord nog '+unanswered.length+' vraag/vragen.';
      errEl.hidden=false; return;
    }

    var answers={};
    questions.forEach(function(q){
      answers[q.id]=parseInt(form.querySelector('input[name="'+q.id+'"]:checked').value);
    });
    var email=document.getElementById('sus-email').value.trim();

    document.getElementById('sus-loading').style.display='block';
    form.querySelector('[type=submit]').disabled=true;

    try {
      var resp=await fetch(WEBHOOK,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({answers:answers,email:email||null})
      });
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      var data=await resp.json();

      form.style.display='none';
      var reportEl=document.getElementById('sus-report');
      reportEl.style.display='block';
      document.getElementById('sus-score-num').textContent=data.susScore;
      document.getElementById('sus-grade-label').textContent=data.grade;
      document.getElementById('sus-report-body').innerHTML=mdToHtml(data.report);

      if(data.emailSent && email){
        var noteEl=document.getElementById('sus-email-note');
        noteEl.textContent=LANG==='en'?'A copy has been sent to '+email+'.':'Er is een kopie verstuurd naar '+email+'.';
        noteEl.hidden=false;
      }

      document.getElementById('sus-download-btn').addEventListener('click',function(){downloadReport(data);});
      document.getElementById('sus-restart-btn').addEventListener('click',function(){location.reload();});

    } catch(err) {
      errEl.textContent=LANG==='en'?'Something went wrong. Please try again.':'Er is iets misgegaan. Probeer het opnieuw.';
      errEl.hidden=false;
      document.getElementById('sus-loading').style.display='none';
      form.querySelector('[type=submit]').disabled=false;
    }
  });
})();
</script>
</div>

{{ with .Site.Params.formbricks }}
{{ if and .serverUrl .surveyId (ne .environmentId "your-environment-id") }}
<div id="fb-survey-container" style="width:100%;">
  <iframe
    src="{{ .serverUrl }}/s/{{ .surveyId }}"
    style="width:100%;height:700px;border:none;border-radius:8px;"
    allow="clipboard-write"
    title="Inkoopscan">
  </iframe>
</div>
{{ else }}
<div class="fb-placeholder">
  <p>De inkoopscan is hier beschikbaar zodra Formbricks is geconfigureerd.</p>
  <p><small>Configureer <code>params.formbricks</code> in hugo.toml met uw server-URL en environment ID.</small></p>
</div>
{{ end }}
{{ end }}

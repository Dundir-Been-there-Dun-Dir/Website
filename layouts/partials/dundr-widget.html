{{/*
  Dundir chat widget.
  Requires params.chatApiKey — set via HUGO_PARAMS_CHATAPIKEY env var
  (GitHub Actions secret) so the key is never committed to git.
  When chatApiKey is empty the widget does not render.
*/}}
{{ $key := .Site.Params.chatApiKey }}
{{ if $key }}
<style>
#dc-btn{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9998;width:3.25rem;height:3.25rem;border-radius:50%;background:#1b4fd8;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(27,79,216,.35);transition:background .15s}
#dc-btn:hover{background:#1440b0}
#dc-panel{position:fixed;bottom:5.5rem;right:1.5rem;z-index:9999;width:min(380px,calc(100vw - 2rem));background:#fff;border:1px solid #d8d8d8;border-radius:.75rem;box-shadow:0 8px 32px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#dc-panel[hidden]{display:none}
#dc-header{background:#1b4fd8;color:#fff;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.9rem}
#dc-close{background:none;border:none;color:#fff;cursor:pointer;font-size:1.25rem;line-height:1;padding:.25rem;opacity:.8}
#dc-close:hover{opacity:1}
#dc-msgs{flex:1;overflow-y:auto;padding:.75rem 1rem;min-height:200px;max-height:340px;display:flex;flex-direction:column;gap:.5rem}
.dc-msg{max-width:85%;padding:.5rem .75rem;border-radius:.5rem;font-size:.875rem;line-height:1.5;white-space:pre-wrap}
.dc-msg.user{align-self:flex-end;background:#1b4fd8;color:#fff}
.dc-msg.bot{align-self:flex-start;background:#f5f4f0;color:#1a1a1a}
.dc-msg.bot.streaming::after{content:' \2588';animation:blink .7s step-end infinite}
@keyframes blink{50%{opacity:0}}
#dc-form{display:flex;border-top:1px solid #d8d8d8;padding:.5rem}
#dc-input{flex:1;border:none;outline:none;padding:.5rem .625rem;font-size:.875rem;font-family:inherit;background:transparent}
#dc-send{background:none;border:none;cursor:pointer;color:#1b4fd8;padding:.5rem;display:flex;align-items:center}
#dc-send:hover{color:#1440b0}
#dc-send:disabled{color:#aaa;cursor:not-allowed}
</style>

<button id="dc-btn" aria-label="Chat met Dundir AI" aria-haspopup="dialog">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>

<div id="dc-panel" role="dialog" aria-modal="true" aria-label="Dundir AI" hidden>
  <div id="dc-header">
    <span>Dundir AI</span>
    <button id="dc-close" aria-label="Sluiten">&#x2715;</button>
  </div>
  <div id="dc-msgs" role="log" aria-live="polite" aria-atomic="false"></div>
  <form id="dc-form">
    <input id="dc-input" type="text" placeholder="Stel een vraag..." autocomplete="off" maxlength="500" aria-label="Bericht">
    <button id="dc-send" type="submit" aria-label="Versturen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>
</div>

<script>
(function () {
  var KEY = {{ $key | jsonify }};
  if (!KEY) return;

  var MODEL = 'anthropic/claude-haiku-4-5';
  var SYSTEM = 'Je bent een behulpzame AI-assistent voor Dundir. Dundir bouwt een AI-gedreven inkoopbeslissingstool voor de bouw en Nederlandse gemeenten. Het systeem draait lokaal bij de klant, gebruikt wiskundige optimalisatie voor de beste leveranciersselectie, en levert audit-klare rapporten die voldoen aan EU CPR 2024 en de Aanbestedingswet. Houd antwoorden kort en direct. Spreek Nederlands tenzij de gebruiker Engels begint. Verwijs geinteresseerde bezoekers naar de Gratis Pijnscan op de website.';
  var WELCOME = 'Goeiedag. Ik ben de Dundir AI-assistent. Wat wil je weten over ons inkoop\u00adoptimalisatiesysteem?';

  var btn = document.getElementById('dc-btn');
  var panel = document.getElementById('dc-panel');
  var closeBtn = document.getElementById('dc-close');
  var msgs = document.getElementById('dc-msgs');
  var form = document.getElementById('dc-form');
  var input = document.getElementById('dc-input');
  var send = document.getElementById('dc-send');
  var history = [];
  var greeted = false;

  function addMsg(role, text) {
    var el = document.createElement('div');
    el.className = 'dc-msg ' + role;
    el.textContent = text;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
  }

  function openPanel() {
    panel.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    input.focus();
    if (!greeted) {
      greeted = true;
      addMsg('bot', WELCOME);
    }
  }

  function closePanel() {
    panel.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    btn.focus();
  }

  btn.addEventListener('click', function () {
    panel.hidden ? openPanel() : closePanel();
  });

  closeBtn.addEventListener('click', closePanel);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) closePanel();
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = '';
    send.disabled = true;
    addMsg('user', text);
    history.push({ role: 'user', content: text });
    streamReply();
  });

  function streamReply() {
    var el = addMsg('bot', '');
    el.classList.add('streaming');

    var body = JSON.stringify({
      model: MODEL,
      stream: true,
      max_tokens: 600,
      messages: [{ role: 'system', content: SYSTEM }].concat(history)
    });

    fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + KEY,
        'Content-Type': 'application/json',
        'HTTP-Referer': 'https://dundir.com',
        'X-Title': 'Dundir'
      },
      body: body
    }).then(function (res) {
      if (!res.ok) {
        return res.json().then(function (d) {
          throw new Error((d.error && d.error.message) || ('HTTP ' + res.status));
        });
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var content = '';

      function read() {
        return reader.read().then(function (chunk) {
          if (chunk.done) {
            el.classList.remove('streaming');
            if (content) history.push({ role: 'assistant', content: content });
            send.disabled = false;
            input.focus();
            return;
          }
          var lines = decoder.decode(chunk.value).split('\n');
          lines.forEach(function (line) {
            if (!line.startsWith('data: ') || line === 'data: [DONE]') return;
            try {
              var d = JSON.parse(line.slice(6));
              var delta = d.choices && d.choices[0] && d.choices[0].delta && d.choices[0].delta.content;
              if (delta) {
                content += delta;
                el.textContent = content;
                msgs.scrollTop = msgs.scrollHeight;
              }
            } catch (_) {}
          });
          return read();
        });
      }
      return read();
    }).catch(function (err) {
      el.classList.remove('streaming');
      el.textContent = 'Er is een fout opgetreden. Probeer het opnieuw.';
      console.error('[Dundir chat]', err);
      send.disabled = false;
      input.focus();
    });
  }
})();
</script>
{{ end }}

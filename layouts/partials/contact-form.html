{{/* FormSubmit.co: a plain POST, no signup, no CORS. The first submission needs
     Christiaan to click a verification mail once. */}}
<form action="https://formsubmit.co/christiaan.verhoef@dundir.com" method="POST" class="mt-1">
  <input type="hidden" name="_subject" value="{{ i18n "f_subject" }}">
  <input type="hidden" name="_cc" value="milan.jelisavcic@dundir.com">
  <input type="hidden" name="_next" value="{{ "success.html" | absURL }}">
  <input type="hidden" name="_captcha" value="false">
  <input type="text" name="_honey" style="display:none">

  <div class="field">
    <label for="cf-name">{{ i18n "f_name" }}</label>
    <input id="cf-name" type="text" name="naam" required autocomplete="name">
  </div>
  <div class="field">
    <label for="cf-org">{{ i18n "f_org" }}</label>
    <input id="cf-org" type="text" name="bedrijf" autocomplete="organization">
  </div>
  <div class="field">
    <label for="cf-mail">{{ i18n "f_mail" }}</label>
    <input id="cf-mail" type="email" name="email" required autocomplete="email">
  </div>
  <div class="field">
    <label for="cf-msg">{{ i18n "f_msg" }}</label>
    <textarea id="cf-msg" name="bericht" required></textarea>
  </div>
  <button type="submit" class="btn btn--primary">{{ i18n "f_send" }}</button>
</form>

baseURL = "https://dundir.com/"
defaultContentLanguage = "nl"
defaultContentLanguageInSubdir = false
title = "Dundir"

enableRobotsTXT = true
enableGitInfo = false
disableKinds = ["taxonomy", "term"]
pluralizeListTitles = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  email = "christiaan.verhoef@dundir.com,milan.jelisavcic@dundir.com"
  linkedIn = "https://www.linkedin.com/company/dundir"

  # SUS survey webhook — n8n on CT104
  # Set RESEND_API_KEY env var on CT104 to enable email delivery
  n8nWebhook = "https://n8n.research-ready.nl/webhook/sus-scan"

  [params.formbricks]
    serverUrl = "https://formbricks.research-ready.nl"
    environmentId = "k0anlmjh40noxil6gt7iq0m1"
    surveyId = "cmrcgiujf0003v4wuky9ijlhp"

  [params.dundrWidget]
    enabled = true
    src = "https://46-224-30-151.sslip.io/v1/loader.js"
    widgetId = "demo"

[languages]
  [languages.nl]
    languageName = "NL"
    languageCode = "nl"
    weight = 1
    title = "Dundir"
    [languages.nl.params]
      description = "AI-gedreven inkoopbeslissingen voor de bouw. Lokaal geïmplementeerd. Wiskundig onderbouwd. Audit-klaar."

  [languages.en]
    languageName = "EN"
    languageCode = "en"
    weight = 2
    title = "Dundir"
    [languages.en.params]
      description = "AI-driven procurement decisions for construction. Locally deployed. Mathematically grounded. Audit-ready."

  [languages.sr]
    languageName = "SR"
    languageCode = "sr"
    weight = 3
    title = "Dundir"
    [languages.sr.params]
      description = "AI sistem za optimizaciju nabavke u građevinarstvu. Lokalna implementacija. Matematički utemeljen. Spreman za reviziju."

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]

baseURL = "https://dundir.com/"
defaultContentLanguage = "nl"
defaultContentLanguageInSubdir = false
title = "Dundir"

enableRobotsTXT = true
enableGitInfo = false
disableKinds = ["taxonomy", "term"]
pluralizeListTitles = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  email = "chris@tonomy.foundation"
  linkedIn = "https://www.linkedin.com/company/dundir"

  [params.formbricks]
    serverUrl = "https://your-formbricks-server.com"
    environmentId = "your-environment-id"
    surveyId = "your-survey-id"

  [params.dundrWidget]
    enabled = true
    src = "https://46-224-30-151.sslip.io/v1/loader.js"
    widgetId = "demo"

[languages]
  [languages.nl]
    languageName = "NL"
    languageCode = "nl"
    weight = 1
    title = "Dundir"
    [languages.nl.params]
      description = "AI-gedreven inkoopbeslissingen voor de bouw. Lokaal geïmplementeerd. Wiskundig onderbouwd. Audit-klaar."

  [languages.sr]
    languageName = "SR"
    languageCode = "sr"
    weight = 2
    title = "Dundir"
    [languages.sr.params]
      description = "AI sistem za optimizaciju nabavke u građevinarstvu. Lokalna implementacija. Matematički utemeljen. Spreman za reviziju."

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]

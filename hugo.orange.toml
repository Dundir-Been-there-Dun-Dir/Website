# The orange variant demo.
#
#   hugo --config hugo.toml,hugo.orange.toml -d /var/www/dundir-orange \
#        -b https://dundir.46-224-30-151.sslip.io/orange/
#
# Everything is inherited from hugo.toml. This file only turns on the palette
# override and points the style guide at the matching hex labels, so the shipped
# build and CI are untouched: neither key is set there.

[params]
  paletteOverride = "css/orange.css"
  tokenset = "tokens_orange"

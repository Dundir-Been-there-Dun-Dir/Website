name: Test and Deploy Hugo Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Grant only what each job needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy can run at a time; never cancel a running deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build and run all tests
  # If any test fails the deploy job never runs and GitHub Pages keeps the
  # last successful version live.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo (extended, for asset pipeline)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.3"
          extended: true

      - name: Configure Pages (sets correct baseURL for this deployment target)
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # ── Content tests ────────────────────────────────────────────────────────

      - name: TEST — All required pages are present
        run: |
          echo "Checking required pages..."
          failed=0
          pages=(
            "public/index.html"
            "public/het-probleem/index.html"
            "public/hoe-het-werkt/index.html"
            "public/over-ons/index.html"
            "public/scan/index.html"
          )
          for page in "${pages[@]}"; do
            if [ -f "$page" ]; then
              echo "  OK  $page"
            else
              echo "  FAIL  $page — missing"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: TEST — CSS asset was generated by Hugo pipeline
        run: |
          echo "Checking CSS asset..."
          count=$(find public/ -name "*.css" | wc -l)
          echo "  Found $count CSS file(s)"
          [ "$count" -ge 1 ] || { echo "  FAIL  No CSS files in output"; exit 1; }
          echo "  OK"

      - name: TEST — Minimum page count (catches silent build failures)
        run: |
          echo "Checking total HTML file count..."
          count=$(find public/ -name "*.html" | wc -l)
          echo "  Found $count HTML files"
          [ "$count" -ge 5 ] || { echo "  FAIL  Expected at least 5 HTML files, found $count"; exit 1; }
          echo "  OK"

      - name: TEST — No em-dashes in HTML output
        run: |
          echo "Checking for em-dashes (forbidden per copy strategy)..."
          # Search for em-dash character, &mdash;, and &#8212;
          if grep -rn --include="*.html" $'—\|&mdash;\|&#8212;' public/; then
            echo "FAIL  Em-dashes found in output — see matches above"
            exit 1
          fi
          echo "  OK  No em-dashes found"

      - name: TEST — No forbidden marketing phrases
        run: |
          echo "Checking for forbidden marketing phrases..."
          failed=0
          declare -a phrases=(
            "transformeer"
            "cutting-edge"
            "revolutie"
            "game-changer"
            "harness"
            "future-proof"
            "toekomstbestendig"
            "best-in-class"
            "seamless"
            "naadloos"
          )
          for phrase in "${phrases[@]}"; do
            if grep -rni --include="*.html" "$phrase" public/ > /dev/null 2>&1; then
              echo "  FAIL  Found forbidden phrase: '$phrase'"
              grep -rni --include="*.html" "$phrase" public/
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "  OK  No forbidden phrases found"

      - name: TEST — All pages have a meta description
        run: |
          echo "Checking meta descriptions..."
          failed=0
          for page in public/index.html public/het-probleem/index.html \
                      public/hoe-het-werkt/index.html public/over-ons/index.html \
                      public/scan/index.html; do
            if grep -q 'name="description"' "$page"; then
              echo "  OK  $page"
            else
              echo "  FAIL  $page — missing meta description"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: TEST — Internal links resolve to existing pages
        run: |
          echo "Checking internal links..."
          python3 << 'PYEOF'
          import os, re, sys

          public_dir = "public"
          errors = []

          # Links to skip (external, mailto, anchors, privacy placeholder)
          skip_prefixes = ("http://", "https://", "mailto:", "#", "//")
          skip_exact = {"/privacy/"}

          for root, dirs, files in os.walk(public_dir):
              dirs.sort()
              for fname in sorted(files):
                  if not fname.endswith(".html"):
                      continue
                  fpath = os.path.join(root, fname)
                  with open(fpath, encoding="utf-8", errors="ignore") as f:
                      content = f.read()

                  links = re.findall(r'href="([^"]*)"', content)
                  for link in links:
                      if any(link.startswith(p) for p in skip_prefixes):
                          continue
                      if link in skip_exact:
                          continue
                      if not link.startswith("/"):
                          continue

                      clean = link.rstrip("/")
                      candidates = [
                          os.path.join(public_dir, clean.lstrip("/")),
                          os.path.join(public_dir, clean.lstrip("/"), "index.html"),
                      ]
                      if not any(os.path.exists(c) for c in candidates):
                          errors.append(f"{fpath}: broken internal link '{link}'")

          if errors:
              for e in errors:
                  print(f"  FAIL  {e}")
              sys.exit(1)
          else:
              print(f"  OK  All internal links resolve")
          PYEOF

      - name: TEST — Sitemap was generated
        run: |
          echo "Checking sitemap..."
          if [ -f "public/sitemap.xml" ]; then
            count=$(grep -c "<loc>" public/sitemap.xml || true)
            echo "  OK  sitemap.xml found with $count entries"
          else
            echo "  FAIL  sitemap.xml missing"
            exit 1
          fi

      # ── Upload the tested build as the Pages artifact ────────────────────────
      # This artifact is exactly what was tested — no second build.

      - name: Upload Pages artifact (tested build only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy — only runs if ALL tests in job 1 passed
  # If this job is skipped, GitHub Pages keeps the previously deployed version.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
